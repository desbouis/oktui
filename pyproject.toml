[tool.ruff]
target-version = "py314"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",   # too long line is managed by the formatter
]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
